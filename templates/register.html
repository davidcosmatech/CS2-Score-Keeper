<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - CS2 Score Keeper
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="logo">
        📝
    </div>

    <h1>
        Create Account
    </h1>

    <p>
        Create your CS2 Score Keeper account.
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            📝 Register
        </button>

    </form>

    <p>
        Already have an account?
    </p>

    <a href="/login">
        🔐 Login
    </a>

    <br>

    <a href="/">
        🏠 Home
    </a>

</div>

</body>

</html>
